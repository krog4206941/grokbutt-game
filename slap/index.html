<style>
html,body{margin:0;height:100%;background:#060709;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Courier New",ui-monospace,Menlo,monospace;color:#d8b25a}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;cursor:grab}
#hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;left:18px;top:14px;letter-spacing:2px;text-shadow:0 0 6px rgba(216,178,90,.25)}
.title{font-size:22px;font-weight:bold}
.stat{font-size:14px;margin-top:6px;color:#bfa36a}
#combo{position:absolute;top:16%;left:0;right:0;text-align:center;font-size:40px;font-weight:bold;letter-spacing:4px;opacity:0;transition:opacity .4s}
#chip{position:absolute;top:calc(16% + 48px);left:0;right:0;text-align:center;font-size:16px;letter-spacing:3px;color:#bfa36a;opacity:0;transition:opacity .3s}
.hint{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:13px;letter-spacing:2px;color:#9c8a62}
.credit{position:absolute;left:18px;bottom:14px;font-size:12px;letter-spacing:1px;color:#8d7d5a}
.credit a{color:#d8b25a;pointer-events:auto;text-decoration:none}
button{position:absolute;pointer-events:auto;background:rgba(20,20,22,.7);color:#d8b25a;border:1px solid #5a4c2c;font:inherit;font-size:13px;letter-spacing:1px;padding:6px 10px;border-radius:6px;cursor:pointer}
#mute{right:16px;top:14px}#turn{right:16px;top:50px}#place{right:16px;top:86px}
#fade{position:fixed;inset:0;background:#0b0d10;opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:5}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px)}
.z{position:absolute;font-size:22px;font-weight:bold;color:#cfc6a8;pointer-events:none;animation:zz 2.6s ease-out forwards}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.7)}20%{opacity:.85}100%{opacity:0;transform:translate(28px,-90px) scale(1.3)}}
#cur{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid rgba(232,200,120,.8);background:rgba(232,200,120,.12);pointer-events:none;display:none;transition:transform .08s}
@media (max-width:600px){.title{font-size:16px}.stat{font-size:12px}.hint{font-size:11px;bottom:38px;padding:0 8px}#combo{font-size:30px}}
</style>

<div id="hud">
  <div class="tl"><div class="title">GROKBUTT SLAP</div>
    <div class="stat" id="stat">SLAPS 0000 · SPS 0.0</div>
    <div class="stat" id="best">BEST 0.0 SPS · COMBO x0</div></div>
  <div id="combo"></div><div id="chip"></div>
  <div class="hint">slap · poke · pull · massage · tickle · fling · hold butt 1.5s · pinch · drag bg to spin</div>
  <div class="credit">Made by Krog &amp; Grok Bot · <a href="https://x.com/grokbutt69" target="_blank" rel="noopener">@grokbutt69</a></div>
  <button id="mute">🔊 SOUND</button><button id="turn">↻ TURN</button><button id="place">⛰ PLACE: POND</button>
</div>
<div class="scan"></div><div id="cur"></div><div id="fade"></div>
<script type="module" src="./main.js"></script>
</body>
