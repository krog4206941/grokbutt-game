{const p=paper.getContext('2d');p.fillStyle='#f4ecd8';p.fillRect(0,0,220,220);
 for(let i=0;i<5200;i++){const g=rnd();p.fillStyle=g<.5?`rgba(150,120,80,${.03+rnd()*.05})`:`rgba(255,255,245,${.05+rnd()*.08})`;p.fillRect(rnd()*220,rnd()*220,1+rnd()*1.5,1+rnd()*1.5)}
 for(let i=0;i<40;i++){p.strokeStyle=`rgba(140,110,70,${.03+rnd()*.04})`;p.lineWidth=.6;p.beginPath();const x=rnd()*220,y=rnd()*220;p.moveTo(x,y);p.lineTo(x+rnd()*14-7,y+rnd()*14-7);p.stroke()}}
let paperPat=null;
// ---------- layout ----------
function resize(){

}
addEventListener('resize',resize);resize();
const P=(x,y)=>[cx+x*A,cy+bob+y*B];
// island shape in unit space
const CR=.3;
function islandPath(off){ctx.beginPath();const x0=-1,y0=-1,s=2,r=CR;
  ctx.save();ctx.translate(cx,cy+bob+off);ctx.scale(A,B);

function frontY(x){const ax=Math.abs(x);if(ax<=1-CR)return 1;const t=(ax-(1-CR))/CR;/* quad approx */const u=1-Math.sqrt(1-t);return 1-CR*(u*u)*1.0-(CR*0)*0+(-CR+CR)*0 - (t*t*CR*.5);}

// ---------- scene data ----------
const POND={x:.5,y:.36,rx:.29,ry:.23};
const inPond=(x,y)=>((x-POND.x)/(POND.rx*.86))**2+((y-POND.y)/(POND.ry*.86))**2<1;
const TREE={x:.48,y:-.56},TREE2={x:-.86,y:.08},HUT={x:-.56,y:-.6},SIGN={x:.02,y:-.66};
const FLOWERS=[[-.38,.46],[-.26,.56],[-.46,.6],[-.3,.38],[.06,-.12],[.14,-.06],[.8,-.3],[-.05,.72]];
const FCOL=['#fffaf0','#f5c84c','#8ec5e8','#fffaf0','#f5c84c','#b9a7e0','#f2a541','#8ec5e8'];
const MUSH=[[-.7,.52,1],[-.62,.6,.7],[-.77,.62,.55]];
const ROCKS=[[.86,.06,1],[.2,.76,.8],[.84,.6,.7],[-.2,-.38,.55]];
seed=11;const TUFTS=[];for(let i=0;i<120;i++){const x=rnd()*1.84-.92,y=rnd()*1.84-.92;if(inIsland(x,y)&&!inPond(x/1.0,y)&&((x-POND.x)/POND.rx)**2+((y-POND.y)/POND.ry)**2>1.2)TUFTS.push([x,y,rnd()]);}
const PATCH=[];for(let i=0;i<26;i++){const x=rnd()*1.6-.8,y=rnd()*1.6-.8;if(inIsland(x,y))PATCH.push([x,y,.08+rnd()*.14,rnd()])}
const STONES=[];for(let i=0;i<34;i++)STONES.push([rnd()*1.9-.95,.35+rnd()*.6,1.5+rnd()*3,rnd()]);
const CLOUDS=[];for(let i=0;i<4;i++)CLOUDS.push({x:rnd(),y:.08+rnd()*.22,s:.7+rnd()*.6,v:.006+rnd()*.006});
const BUTTER=[{c:'#f3c33f',ph:0,cx:-.3,cy:.45},{c:'#7fb8e0',ph:2.4,cx:.2,cy:-.1}];
let leaves=[],parts=[],ripples=[];
// ---------- GROKBUTT ----------
const gb={x:-.05,y:.18,z:0,vz:0,ang:0,tang:0,emo:'normal',state:'idle',timer:1.6,tx:0,ty:0,act:null,at:0,sq:0,blink:2.5,blinkT:0,lean:0,phase:0,last:'',look:0,wet:0};
const ACTS={
  nap:{tgt:()=>[TREE.x-.04,TREE.y+.24],dur:7,ang:0,start(){gb.emo='sleepy'},tick(dt,t){gb.sq=Math.sin(t*2.2)*.035;if((t%1.1)<dt)spawnZ()}},
  sniff:{tgt:()=>[-.2,.42],dur:3.6,ang:-1.4,start(){gb.emo='curious'},tick(dt,t){gb.lean=-.22+Math.sin(t*9)*.05*(t<2.4);if(t>2.4&&gb.emo!=='happy'){gb.emo='happy';hop(300);sparkle(-.36,.48,6,'#f5c84c')}if(t<2.4&&(t%.5)<dt)sparkle(-.34,.47,1,'#fff4c8')}},
  splash:{tgt:()=>[POND.x,POND.y],dur:3.8,ang:0,start(){gb.emo='happy'},tick(dt,t){if(gb.z===0&&gb.vz===0&&t<3.2)hop(260+rnd()*120)}},
  bounce:{tgt:()=>[-.5,.48],dur:2.9,ang:.6,start(){gb.emo='happy'},tick(dt,t){if(gb.z===0&&gb.vz===0&&t<2.3){hop(480);sparkle(gb.x,gb.y,3,'#f5c84c')}}},
  look:{tgt:()=>{for(let i=0;i<20;i++){const x=rnd()*1.3-.65,y=rnd()*1.1-.3;if(!inPond(x,y))return[x,y]}return[0,.2]},dur:3.2,ang:0,start(){gb.emo='curious'},tick(dt,t){gb.look=Math.sin(t*1.6)*.12;if(t>1.4&&gb.emo==='curious'){gb.emo='happy';hop(220)}}},
  read:{tgt:()=>[SIGN.x+.02,SIGN.y+.2],dur:3.4,ang:Math.PI,start(){gb.emo='curious';addTxt('?')},tick(dt,t){if(t>2.2&&!gb._r){gb._r=1;addTxt('!');hop(260)}}},
};
const ORDER=['nap','sniff','splash','bounce','look','read'];
function hop(v){gb.vz=v*k}
function obstacles(){const fx=R*.55/A,fy=R*.3/B,O=[];

  for(const r of ROCKS)O.push({e:1,x:r[0],y:r[1]-6*r[2]*k/B,rx:16*r[2]*k/A+fx,ry:9*r[2]*k/B+fy});
  O.push({e:1,x:TREE.x,y:TREE.y,rx:10*k/A+fx,ry:7*k/B+fy},{e:1,x:TREE2.x,y:TREE2.y,rx:7*k/A+fx,ry:5*k/B+fy});
  O.push({x0:HUT.x-62*k/A-fx,x1:HUT.x+88*k/A+fx,y0:HUT.y-34*k/B-fy,y1:HUT.y+6*k/B+fy});
  O.push({x0:SIGN.x-78*k/A-fx,x1:SIGN.x+78*k/A+fx,y0:SIGN.y-8*k/B-fy,y1:SIGN.y+6*k/B+fy});
  O.push({x0:.02,x1:.95,y0:-1,y1:-.88+fy});return O}
let OBS=[];
function blocked(x,y,skipPond){if(!inIsland(x,y))return true;for(const o of OBS){if(o.e){if(skipPond&&o.pond)continue;if(((x-o.x)/o.rx)**2+((y-o.y)/o.ry)**2<1)return true}else if(x>o.x0&&x<o.x1&&y>o.y0&&y<o.y1)return true}return false}
const GN=36,G0=-.9,GS=1.8/(GN-1);
function nearestFree(x,y){let best=null,bd=1e9;for(let i=0;i<GN;i++)for(let j=0;j<GN;j++){const cx2=G0+i*GS,cy2=G0+j*GS;if(blocked(cx2,cy2))continue;const d=((cx2-x)*A)**2+((cy2-y)*B)**2;if(d<bd){bd=d;best=[cx2,cy2]}}return best||[0,.2]}
function clearLine(ax,ay,bx,by){const n=Math.ceil(Math.hypot((bx-ax)*A,(by-ay)*B)/(4*k))+1;for(let i=1;i<n;i++){const t=i/n;if(blocked(ax+(bx-ax)*t,ay+(by-ay)*t))return false}return true}
function findPath(sx,sy,tx,ty){
  if(clearLine(sx,sy,tx,ty))return[[tx,ty]];
  const ci=x=>clamp(Math.round((x-G0)/GS),0,GN-1),id=(i,j)=>i*GN+j;
  const si=ci(sx),sj=ci(sy),ti=ci(tx),tj=ci(ty);const g=new Float64Array(GN*GN).fill(1e9),from=new Int32Array(GN*GN).fill(-1),done=new Uint8Array(GN*GN);
  const free=new Uint8Array(GN*GN);for(let i=0;i<GN;i++)for(let j=0;j<GN;j++)free[id(i,j)]=blocked(G0+i*GS,G0+j*GS)?0:1;
  free[id(si,sj)]=1;free[id(ti,tj)]=1;g[id(si,sj)]=0;const open=[id(si,sj)];const h=(i,j)=>Math.hypot((i-ti)*A,(j-tj)*B)*GS;
  while(open.length){let bi=0,bf=1e18;for(let q=0;q<open.length;q++){const c=open[q],f=g[c]+h((c/GN)|0,c%GN);if(f<bf){bf=f;bi=q}}const c=open.splice(bi,1)[0];if(done[c])continue;done[c]=1;
    const i=(c/GN)|0,j=c%GN;if(i===ti&&j===tj)break;
    for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){if(!di&&!dj)continue;const ni=i+di,nj=j+dj;if(ni<0||nj<0||ni>=GN||nj>=GN)continue;const n=id(ni,nj);if(!free[n]||done[n])continue;if(di&&dj&&(!free[id(i+di,j)]||!free[id(i,j+dj)]))continue;const ng=g[c]+Math.hypot(di*A,dj*B)*GS;if(ng<g[n]){g[n]=ng;from[n]=c;open.push(n)}}}
  let T2=id(ti,tj);if(from[T2]<0){let bd=1e18;for(let c=0;c<GN*GN;c++){if(!done[c]||c===id(si,sj))continue;const d=(((c/GN)|0)-ti)**2*A*A+((c%GN)-tj)**2*B*B;if(d<bd){bd=d;T2=c}}if(from[T2]<0)return[[sx,sy]];tx=G0+((T2/GN)|0)*GS;ty=G0+(T2%GN)*GS}
  const pts=[];for(let c=T2;c!==id(si,sj)&&c>=0;c=from[c])pts.unshift([G0+((c/GN)|0)*GS,G0+(c%GN)*GS]);pts[pts.length-1]=[tx,ty];

  const out=[];let cx2=sx,cy2=sy,i=0;while(i<pts.length){let j=pts.length-1;while(j>i&&!clearLine(cx2,cy2,pts[j][0],pts[j][1]))j--;out.push(pts[j]);cx2=pts[j][0];cy2=pts[j][1];i=j+1}return out}
function goTo(x,y,act,enter){OBS=obstacles();x=clamp(x,-.86,.86);y=clamp(y,-.84,.84);let fin=null;if(enter){fin=[x,y];}if(blocked(x,y))[x,y]=nearestFree(x,y);
  let sx=gb.x,sy=gb.y,pre=[];if(blocked(sx,sy)){const f=nearestFree(sx,sy);pre.push(f);sx=f[0];sy=f[1]}
  gb.path=pre.concat(findPath(sx,sy,x,y));if(fin)gb.path.push(fin);gb.tx=gb.path[0][0];gb.ty=gb.path[0][1];
  gb.state='roll';gb.act=act;gb.emo='normal';gb.lean=0;gb.look=0;gb._r=0}
function startAct(n){const a=ACTS[n];gb.state='act';gb.act=n;gb.at=0;gb.tang=a.ang;a.start();gb.last=n}
function nextAct(){let n;do{n=ORDER[Math.floor(rnd()*ORDER.length)]}while(n===gb.last);const [x,y]=ACTS[n].tgt();goTo(x,y,n,n==='splash')}
function addTxt(s){const [sx,sy]=P(gb.x,gb.y);parts.push({type:'txt',s,x:sx+R*.9,y:sy-R*2.3,vy:-14*k,life:1.6,max:1.6})}
function spawnZ(){parts.push({type:'z',x:0,y:0,ox:gb.x,oy:gb.y,t:0,life:2.6,max:2.6,s:.7+rnd()*.5})}
function sparkle(x,y,n,c){for(let i=0;i<n;i++)parts.push({type:'star',wx:x,wy:y,ox:(rnd()-.5)*R*2.4,oy:-R*(.6+rnd()*1.4),vy:-20*k-rnd()*20*k,life:1+rnd()*.6,max:1.5,c,r:(2+rnd()*2.5)*k})}
function splashFx(){for(let i=0;i<10;i++){const a=rnd()*Math.PI*2;parts.push({type:'drop',wx:gb.x,wy:gb.y,dx:Math.cos(a)*(40+rnd()*60)*k,dz:(140+rnd()*140)*k,z:2,px:0,life:1.4,max:1.4})}ripples.push({x:gb.x,y:gb.y,t:0})}
function update(dt,t){
  const g=1500*k;
  // physics
  if(gb.vz!==0||gb.z>0){gb.vz-=g*dt;gb.z+=gb.vz*dt;if(gb.z<=0){const imp=-gb.vz;gb.z=0;gb.vz=0;gb.sq=Math.min(.28,imp/(1800*k));if(inPond(gb.x,gb.y))splashFx()}}

  gb.blink-=dt;if(gb.blink<0){gb.blinkT=.14;gb.blink=2+rnd()*3.5}gb.blinkT=Math.max(0,gb.blinkT-dt);
  if(gb.state==='roll'){

    else{const sp=.42*dt,m=Math.min(sp,d);gb.x+=dx/d*m;gb.y+=dy/d*m;gb.tang=Math.atan2(dx*A,dy*B);if(gb.z===0&&gb.vz===0)hop(150)}
  }else if(gb.state==='act'){
    gb.at+=dt;ACTS[gb.act].tick(dt,gb.at);if(gb.at>ACTS[gb.act].dur){gb.state='idle';gb.timer=1.2+rnd()*1.6;gb.emo='normal';gb.lean=0;gb.look=0;gb.sq=0}
  }else if(gb.state==='react'){
    gb.at+=dt;if(gb.at>.35&&gb.emo==='surprised'){gb.emo='happy'}if(gb.at>1.8){gb.state='idle';gb.timer=1.4;gb.emo='normal'}
  }else{ // idle
    gb.timer-=dt;if(shot!=='front')gb.tang=Math.sin(t*.7)*.5;if(gb.timer<0)nextAct();
  }
  // turn
  let da=gb.tang-gb.ang;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;gb.ang+=da*Math.min(1,dt*7);

  if(rnd()<dt*1.3)ripples.push({x:POND.x+(rnd()-.5)*POND.rx*1.2,y:POND.y+(rnd()-.5)*POND.ry*1.2,t:0,amb:1});

  if(rnd()<dt*.7&&leaves.length<8)leaves.push({x:TREE.x+(rnd()-.5)*.3,y:TREE.y+(rnd()-.2)*.12,h:(120+rnd()*40)*k,ph:rnd()*6,c:rnd()<.5?'#d9a441':'#9cbf5a',life:1});

// ---------- drawing helpers ----------
function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fill()}

function drawCloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=.85;
  ell(0,8,70,16,'rgba(170,190,205,.25)');
  for(const [a,b,r] of [[-42,0,24],[-14,-12,32],[20,-6,28],[46,4,20],[0,6,30]])ell(a,b,r,r*.82,'#fffdf6');
  ctx.globalAlpha=1;ctx.restore()}
function drawBackground(t){
  ctx.fillStyle=paperPat;ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(190,215,230,.35)');g.addColorStop(.45,'rgba(244,236,216,0)');g.addColorStop(1,'rgba(225,205,165,.25)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

}
function drawIslandBody(t){
  // shadow on paper
  const sy=cy+B+T+70*k;ell(cx,sy,A*.8*(1-bob/400),A*.09,'rgba(120,95,60,.12)');ell(cx,sy,A*.5,A*.05,'rgba(120,95,60,.1)');

  const ug=ctx.createLinearGradient(0,cy+bob+B,0,cy+bob+B+T+64*k);ug.addColorStop(0,'#7a5a3c');ug.addColorStop(1,'#5b4330');ctx.fillStyle=ug;ctx.fill();ctx.restore();

  for(const p of parts){const a=clamp(p.life/(p.max*.5),0,1);ctx.globalAlpha=a;
    if(p.type==='star'){const [x,y]=P(p.wx,p.wy);ctx.fillStyle=p.c;star(x+p.ox,y+p.oy,p.r)}
    else if(p.type==='txt'){ctx.fillStyle='#3e4a5a';ctx.font=`900 ${20*k}px ${FONT}`;ctx.textAlign='center';ctx.fillText(p.s,p.x,p.y)}
    else if(p.type==='z'){const [x,y]=P(p.ox,p.oy);ctx.fillStyle='#4f6f86';ctx.font=`800 ${(11+p.t*5)*k*p.s}px ${FONT}`;ctx.textAlign='center';ctx.fillText('z',x+R*.7+p.t*10*k+Math.sin(p.t*3)*4*k,y-R*2-p.t*16*k)}
    else if(p.type==='drop'){const [x,y]=P(p.wx,p.wy);ell(x+p.px,y-p.z-R*.3,2.4*k,3*k,'#bfe6f5')}
  }ctx.globalAlpha=1}
function star(x,y,r){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.4:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
// floating mini rocks
function drawMini(t){for(const [ox,oy,s,ph] of [[-1.25,.55,1,0],[1.22,.15,.7,2]]){const x=cx+ox*A,y=cy+oy*B+Math.sin(t*.8+ph)*6*k;const w=26*k*s;
  ctx.fillStyle='#7a5a3c';ctx.beginPath();ctx.moveTo(x-w,y);ctx.quadraticCurveTo(x,y+w*1.4,x+w,y);ctx.fill();ell(x,y,w,w*.4,'#9cc766');ell(x-w*.3,y-w*.1,w*.3,w*.12,'rgba(230,245,170,.5)')}}
// ---------- UI text ----------
function drawUI(t){
  ctx.textAlign='center';ctx.textBaseline='alphabetic';const small=Math.min(W,H)<600;
  ctx.fillStyle='rgba(70,80,70,.72)';ctx.font=`700 ${small?13:16}px ${FONT}`;
  const y0=small?Math.max(40,H*.07):46;if(W<520){ctx.fillText('Tap GROKBUTT to say hi',W/2,y0);ctx.fillText('Tap the grass to send him rolling',W/2,y0+19)}else ctx.fillText('Tap GROKBUTT to say hi  ·  Tap the grass to send him rolling',W/2,y0);
  ctx.fillStyle='rgba(90,80,60,.55)';ctx.font=`600 ${small?11:13}px ${FONT}`;ctx.textAlign=small?'center':'right';
  ctx.fillText('Made by Krog & Grok Bot',small?W/2:W-20,H-(small?18:20));
}
// ---------- main ----------
function frame(t,dt){
  bob=Math.sin(t*.6)*4*k;update(dt,t);
  drawBackground(t);drawMini(t);drawIslandBody(t);drawTop(t);
  const objs=[];
  objs.push([TREE.y,()=>drawTree(TREE,1,t)],[TREE2.y,()=>drawTree(TREE2,.62,t)],[HUT.y,()=>drawHut(t)],[SIGN.y,()=>drawSign(t)],[-.9,()=>drawFence(t)]);
  FLOWERS.forEach((f,i)=>objs.push([f[1],()=>drawFlower(f,i,t)]));MUSH.forEach(m=>objs.push([m[1],()=>drawMush(m,t)]));ROCKS.forEach(r=>objs.push([r[1],()=>drawRock(r)]));
  leaves.forEach(l=>objs.push([l.y,()=>drawLeaf(l,t)]));objs.push([gb.y+.001,()=>drawGB(t)]);
  objs.sort((a,b)=>a[0]-b[0]);for(const o of objs)o[1]();
  BUTTER.forEach(b=>drawButterfly(b,t));drawParts(t);drawUI(t);
}
// input
let actx=null;function boop(f){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(f,actx.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.8,actx.currentTime+.12);g.gain.setValueAtTime(.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.25);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.26)}catch(e){}}
cv.addEventListener('pointerdown',e=>{
  const px=e.clientX,py=e.clientY;const [gx,gy]=P(gb.x,gb.y);
  if(Math.hypot(px-gx,py-(gy-gb.z-R))<R*1.5){gb.state='react';gb.at=0;gb.emo='surprised';gb.tang=0;gb.lean=0;hop(560);sparkle(gb.x,gb.y,7,'#f5c84c');boop(420);if(inPond(gb.x,gb.y))splashFx();return}
  const wx=(px-cx)/A,wy=(py-cy-bob)/B;if(inIsland(wx,wy)){goTo(wx,wy,'goto');boop(300);sparkle(wx,wy,0,'')}
});
// preview hooks (?shot=front|back)
const shot=Q.get('shot');if(Q.get('debug'))window.__gb={gb,goTo,findPath,clearLine,blk:(x,y)=>{OBS=obstacles();return blocked(x,y)}};
if(shot==='front'){gb.x=-.08;gb.y=.12;gb.state='idle';gb.timer=99;gb.emo='normal';gb.blink=99;gb.ang=gb.tang=.2}
if(shot==='back'){gb.x=.06;gb.y=-.44;startAct('read');gb.ang=Math.PI}
if(shot==='nap'){gb.x=TREE.x-.02;gb.y=TREE.y+.2;startAct('nap')}
let last=performance.now(),t0=last;
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(shot&&Q.get('freeze'))dt=Math.min(dt,.016);frame((now-t0)/1000,dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
